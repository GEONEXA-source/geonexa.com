<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Deactivated — GeoNEXA AI</title>
   <link rel="icon" type="image/png" href="logo.png">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#080d13;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;padding:20px;}
  .card{max-width:420px;width:100%;background:#0f1620;border:1px solid #1d2a38;border-radius:16px;padding:28px 24px;text-align:center;}
  .icon{width:56px;height:56px;border-radius:50%;background:rgba(20,184,166,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;}
  h1{font-size:19px;font-weight:800;margin:0 0 10px;}
  p{font-size:14px;line-height:1.5;color:#9fb0c2;margin:0 0 20px;}
  button{width:100%;background:#14b8a6;color:#04231d;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  #status{font-size:13px;color:#f87171;margin-top:12px;min-height:16px;}
  a{color:#9fb0c2;font-size:13px;display:inline-block;margin-top:14px;text-decoration:none;}
  a:hover{color:#e8edf2;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Your account is deactivated</h1>
  <p>You deactivated this GeoNEXA AI account. Your data is safe — reactivate it anytime to pick up right where you left off.</p>
  <button id="reactivateBtn">Reactivate my account</button>
  <div id="status"></div>
  <a href="#" id="signOutLink">Sign out instead</a>
</div>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="loader.js"></script>
<script src="account-deactivated.js"></script>
</body>
</html>
