<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Property Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ogwckglzluhjwmucrodb.supabase.co" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#080b0f; --sidebar:#0a0d12; --panel:#0f151c; --panel-alt:#121a22;
    --border:#1d2833; --border-soft:#161f28; --text:#f3f6f8; --muted:#8b99a6;
    --accent:#22e0ab; --accent-dim:#16a97f; --accent-glow:rgba(34,224,171,0.14);
    --danger:#ff6b6b;
    --radius-lg:16px; --radius-md:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 460px at 100% -10%, rgba(34,224,171,0.06), transparent 55%), var(--bg);
    color:var(--text); display:flex; min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}

  .sidebar{
    width:230px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0;
    overflow-y:auto;transition:transform .25s ease;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0d9488);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#06120e;}
  .brand .name{font-size:15px;font-weight:800;line-height:1.1;}
  .brand .tag{font-size:10px;color:var(--muted);}
  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:600;transition:.15s ease;}
  .navlink:hover{background:var(--panel-alt);color:var(--text);}
  .navlink.active{background:var(--accent-glow);color:var(--accent);}

  .main{margin-left:230px;flex:1;padding:22px 28px 48px;min-width:0;}
  .topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .hamburger{display:none;}
  h1{font-size:24px;font-weight:800;letter-spacing:-0.01em;}
  .subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;}

  .filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  #districtFilter{flex:1;min-width:180px;background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;font-family:inherit;}
  #districtFilter:focus{outline:none;border-color:var(--accent);}
  #filterBtn{background:var(--accent);color:#06120e;border:none;padding:0 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
  #filterBtn:hover{background:var(--accent-dim);}

  #resultsSubtitle{font-size:12.5px;color:var(--muted);margin-bottom:14px;}

  .parcel-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px;}
  .parcel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .parcel-title{font-size:14px;font-weight:700;}
  .parcel-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .land-use-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(34,224,171,.15);color:var(--accent);white-space:nowrap;}
  .parcel-meta{display:flex;gap:22px;margin-bottom:14px;flex-wrap:wrap;}
  .parcel-meta div span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px;}
  .parcel-meta div b{font-size:12.5px;}
  .parcel-actions{display:flex;gap:9px;flex-wrap:wrap;}

  .btn-solid-sm{background:var(--accent);color:#06120e;border:none;border-radius:9px;padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-solid-sm:hover{background:var(--accent-dim);}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-outline:hover{background:var(--panel-alt);}
  .btn-outline:disabled{opacity:.6;cursor:default;}

  .empty-state{text-align:center;padding:50px 16px;color:var(--muted);}
  .empty-state .icon{font-size:30px;margin-bottom:10px;}
  .empty-state p{font-size:13px;line-height:1.6;max-width:380px;margin:0 auto;}

  @media (max-width:820px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;padding:16px;}
    .hamburger{display:flex;width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--border);align-items:center;justify-content:center;color:var(--text);order:-1;}
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="mark">G</div>
    <div>
      <div class="name">GeoNEXA AI</div>
      <div class="tag">Connecting the World, Spatial Sense</div>
    </div>
  </div>
  <nav>
    <a class="navlink" href="dashboard.html">🏠 Dashboard</a>
    <a class="navlink" href="map-explorer.html">🗺️ Map Explorer</a>
    <a class="navlink active" href="property-analysis.html">📊 Property Analysis</a>
    <a class="navlink" href="reports.html">📄 Reports</a>
    <a class="navlink" href="saved-properties.html">❤ Saved Properties</a>
    <a class="navlink" href="ai-assistant.html">🤖 AI Assistant</a>
    <a class="navlink" href="subscription.html">💳 Subscription</a>
    <a class="navlink" href="settings.html">⚙️ Settings</a>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div>
      <h1>Property Analysis</h1>
      <div class="subtitle">Browse parcels and jump into AI-powered analysis.</div>
    </div>
  </div>

  <div class="filter-row">
    <input type="text" id="districtFilter" placeholder="Filter by district… (press Enter)">
    <button id="filterBtn">Search</button>
  </div>

  <div id="resultsSubtitle">Loading…</div>
  <div id="parcelList"><div class="empty-state"><p>Loading parcels…</p></div></div>
</div>

<script defer src="config.js"></script>
<script defer src="property-analysis.js"></script>
<script defer src="./pwa-register.js"></script>
<script defer src="loader.js"></script>
<script defer src="apply-theme.js"></script> 
</body>
</html>
