<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Control</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#080d13;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;padding:20px;}
  .card{max-width:440px;width:100%;background:#0f1620;border:1px solid #1d2a38;border-radius:16px;padding:28px 24px;}
  h1{font-size:19px;font-weight:800;margin:0 0 4px;}
  .sub{font-size:13px;color:#6b7c8d;margin:0 0 20px;}
  #statusText{font-weight:800;font-size:16px;margin-bottom:16px;}
  label{display:block;font-size:13px;color:#9fb0c2;margin-bottom:6px;}
  textarea{width:100%;min-height:70px;background:#0a0f16;border:1px solid #1d2a38;border-radius:10px;color:#e8edf2;padding:10px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:18px;}
  .row{display:flex;gap:10px;}
  button{flex:1;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  #deactivateBtn{background:#f87171;color:#2a0a0a;}
  #activateBtn{background:#14b8a6;color:#04231d;}
</style>
</head>
<body>
<div class="card">
  <h1>Owner Control</h1>
  <p class="sub">Site-wide switch. Only your account can see this page.</p>
  <div id="statusText">Checking…</div>
  <label for="msgInput">Message shown to visitors while deactivated</label>
  <textarea id="msgInput" placeholder="We're performing scheduled maintenance. Please check back soon."></textarea>
  <div class="row">
    <button id="deactivateBtn">Deactivate site</button>
    <button id="activateBtn">Reactivate site</button>
  </div>
</div>
<script src="config.js"></script>
 <script src="own-login.html"></script>
<script src="owner-control.js"></script>
</body>
</html>
