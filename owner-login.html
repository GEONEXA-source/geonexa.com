<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Access</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#080d13;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;padding:20px;}
  .card{max-width:360px;width:100%;background:#0f1620;border:1px solid #1d2a38;border-radius:16px;padding:28px 24px;}
  h1{font-size:18px;font-weight:800;margin:0 0 18px;text-align:center;}
  label{display:block;font-size:13px;color:#9fb0c2;margin:0 0 6px;}
  input{width:100%;background:#0a0f16;border:1px solid #1d2a38;border-radius:10px;color:#e8edf2;padding:11px;font-size:14px;margin-bottom:14px;}
  button{width:100%;background:#14b8a6;color:#04231d;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  #status{font-size:13px;color:#f87171;margin-top:12px;min-height:16px;text-align:center;}
</style>
</head>
<body>
<div class="card">
  <h1>Owner Access</h1>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit">Enter</button>
  </form>
  <div id="status"></div>
</div>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="loader.js"></script>
<script src="owner-login.js"></script>
</body>
</html>
