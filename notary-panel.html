<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notary Workspace — GeoNEXA AI</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#080d13;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;padding:24px 18px 60px;}
  .wrap{max-width:560px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .top a{color:#9fb0c2;font-size:14px;text-decoration:none;}
  .top a:hover{color:#e8edf2;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;}
  .sub{font-size:13px;color:#6b7c8d;margin:0 0 24px;}
  .card{background:#0f1620;border:1px solid #1d2a38;border-radius:16px;padding:22px;margin-bottom:18px;}
  .card h2{font-size:15px;font-weight:800;margin:0 0 16px;color:#9fb0c2;text-transform:uppercase;letter-spacing:.04em;}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #152030;font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:#6b7c8d;}
  .row .v{color:#e8edf2;font-weight:600;text-align:right;max-width:60%;}
  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(20,184,166,.15);color:#14b8a6;}
  a.linkbtn{display:block;width:100%;background:#14b8a6;color:#04231d;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;margin-bottom:10px;}
  a.linkbtn.secondary{background:#152030;color:#e8edf2;}
  button#signOut{display:block;width:100%;background:#152030;color:#f87171;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  p.msg{font-size:13.5px;line-height:1.5;color:#9fb0c2;margin:0 0 20px;text-align:center;}
  #blockedSection{display:none;text-align:center;padding:40px 10px;}
  #loadingState{text-align:center;color:#6b7c8d;padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Notary Workspace</h1>
      <p class="sub">Your public listing and profile</p>
    </div>
    <a href="dashboard.html">← Dashboard</a>
  </div>

  <div id="loadingState">Loading…</div>

  <div id="blockedSection">
    <p class="msg" id="blockedText"></p>
    <a class="linkbtn" href="users-access.html">Go to Users & Access</a>
  </div>

  <div id="content" style="display:none;">
    <div class="card">
      <h2>Status</h2>
      <span class="badge">● Verified Notary</span>
    </div>

    <div class="card">
      <h2>Your public listing</h2>
      <div class="row"><span class="k">Name</span><span class="v" id="nName">—</span></div>
      <div class="row"><span class="k">Phone</span><span class="v" id="nPhone">—</span></div>
      <div class="row"><span class="k">Email</span><span class="v" id="nEmail">—</span></div>
      <div class="row"><span class="k">District</span><span class="v" id="nDistrict">—</span></div>
      <div class="row"><span class="k">Sector</span><span class="v" id="nSector">—</span></div>
      <div class="row"><span class="k">Address</span><span class="v" id="nAddress">—</span></div>
      <div class="row"><span class="k">Bio</span><span class="v" id="nBio">—</span></div>
    </div>

    <a class="linkbtn" href="professional-profile-setup.html">Edit my public profile</a>
    <a class="linkbtn secondary" href="notaires.html">View public directory</a>
    <button id="signOut">Sign out</button>
  </div>
</div>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="loader.js"></script>
<script src="notary-panel.js"></script>
</body>
</html>
