<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoNEXA AI — Find a Notaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#080b0f;--sidebar:#0a0d12;--panel:#0f151c;--panel-alt:#121a22;--border:#1d2833;--text:#f3f6f8;--muted:#8b99a6;--accent:#22e0ab;--accent-dim:#16a97f;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  .sidebar{width:230px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0d9488);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06120e;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:600;}
  .navlink:hover{background:var(--panel-alt);color:var(--text);}
  .navlink.active{background:rgba(34,224,171,.14);color:var(--accent);}
  .main{margin-left:230px;flex:1;padding:22px 28px 48px;}
  h1{font-size:24px;font-weight:800;}
  .subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;margin-bottom:20px;}
  .filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-row input{flex:1;min-width:160px;padding:10px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);font-size:13px;}
  .filter-row button{background:var(--accent);color:#06120e;border:none;padding:0 20px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .n-name{font-size:14.5px;font-weight:700;margin-bottom:4px;}
  .n-loc{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .n-row{font-size:12.5px;margin-bottom:5px;display:flex;gap:8px;}
  .n-row .label{color:var(--muted);width:60px;flex-shrink:0;}
  .empty-state{text-align:center;padding:40px 16px;color:var(--muted);}
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand"><div class="mark">G</div><div style="font-weight:800;font-size:14px;">GeoNEXA AI</div></div>
  <nav>
    <a class="navlink" href="dashboard.html">🏠 Dashboard</a>
    <a class="navlink" href="marketplace.html">🏘️ Marketplace</a>
    <a class="navlink active" href="notaires.html">⚖️ Notaires</a>
    <a class="navlink" href="engineers.html">👷 Find an Engineer</a>
    <a class="navlink" href="settings.html">⚙️ Settings</a>
  </nav>
</div>

<div class="main">
  <h1>Find a Notaire</h1>
  <div class="subtitle">Verified notaires by location, for official transfer and contract steps.</div>

  <div class="filter-row">
    <input type="text" id="filterInput" placeholder="Filter by district or sector…">
    <button id="filterBtn">Search</button>
  </div>

  <div class="grid" id="notaireGrid"><div class="empty-state"><p>Loading…</p></div></div>
</div>

<script defer src="config.js"></script>
<script defer src="notaires.js"></script>
</body>
</html>
