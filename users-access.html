<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users & Access — GeoNEXA AI</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#080d13;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf2;padding:24px 18px 60px;}
  .wrap{max-width:560px;margin:0 auto;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .top a{color:#9fb0c2;font-size:14px;text-decoration:none;}
  .top a:hover{color:#e8edf2;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;}
  .sub{font-size:13px;color:#6b7c8d;margin:0 0 24px;}
  .card{background:#0f1620;border:1px solid #1d2a38;border-radius:16px;padding:22px;margin-bottom:18px;}
  .card h2{font-size:15px;font-weight:800;margin:0 0 16px;color:#9fb0c2;text-transform:uppercase;letter-spacing:.04em;}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #152030;font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:#6b7c8d;}
  .row .v{color:#e8edf2;font-weight:600;text-align:right;}
  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge.pending{background:rgba(217,184,76,.15);color:#d9b84c;}
  .badge.approved{background:rgba(20,184,166,.15);color:#14b8a6;}
  .badge.rejected{background:rgba(248,113,113,.15);color:#f87171;}
  .badge.none{background:rgba(159,176,194,.15);color:#9fb0c2;}
  p.msg{font-size:13.5px;line-height:1.5;color:#9fb0c2;margin:0 0 16px;}
  label{display:block;font-size:13px;color:#9fb0c2;margin:0 0 6px;}
  select, input[type="file"]{width:100%;background:#0a0f16;border:1px solid #1d2a38;border-radius:10px;color:#e8edf2;padding:11px;font-size:14px;margin-bottom:16px;}
  button{width:100%;background:#14b8a6;color:#04231d;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  a.linkbtn{display:block;width:100%;background:#14b8a6;color:#04231d;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;margin-bottom:10px;}
  a.linkbtn.secondary{background:#152030;color:#e8edf2;}
  #statusMsg{font-size:13px;margin-top:12px;min-height:16px;}
  #loadingState{text-align:center;color:#6b7c8d;padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Users & Access</h1>
      <p class="sub">Your profile and account role</p>
    </div>
    <a href="dashboard.html">← Dashboard</a>
  </div>

  <div id="loadingState">Loading…</div>

  <div id="content" style="display:none;">
    <div class="card">
      <h2>Your profile</h2>
      <div class="row"><span class="k">Name</span><span class="v" id="pName">—</span></div>
      <div class="row"><span class="k">Email</span><span class="v" id="pEmail">—</span></div>
      <div class="row"><span class="k">Phone</span><span class="v" id="pPhone">—</span></div>
      <div class="row"><span class="k">Province</span><span class="v" id="pProvince">—</span></div>
      <div class="row"><span class="k">Current role</span><span class="v" id="pRole">—</span></div>
    </div>

    <div class="card" id="verificationCard">
      <h2>Professional status</h2>
      <div id="verificationBody"></div>
    </div>
  </div>
</div>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="loader.js"></script>
<script src="users-access.js"></script>
</body>
</html>
